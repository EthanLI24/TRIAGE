name: CI

on:
  push:
  pull_request:

jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU PyTorch
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package
        run: python -m pip install -e .

      - name: Verify the editable install exposes the extension modules
        run: python -c "import TRIAGE, triage_config, triage_calibration"

      - name: Run CPU tests
        run: bash scripts/run_tests.sh

      - name: Check generated result tables
        run: python scripts/render_results.py --check

      - name: Check shell scripts parse
        run: |
          for f in examples/*.sh scripts/*.sh configs/models/*.sh; do
            bash -n "$f"
          done
